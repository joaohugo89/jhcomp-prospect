# JH.COMP Prospect - pipeline (doc 10 §9).
#
# hygiene -> backend (build, unit and integration tests) and frontend (lint,
# types, tests, build, dependency audit) -> end-to-end against the full
# containerised environment (D17) and validation of the production compose
# (D27).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancels older runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects which parts of the repository already exist.
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f backend/pom.xml ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f frontend/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  # Always runs: makes sure no secret is ever committed (RNF-006).
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No .env file is committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. Remove it from version control."
            exit 1
          fi
          # Any .env* other than the examples (.env.example, .env.prod.example)
          offenders=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '\.env(\.[a-z]+)?\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Environment files are committed:"; echo "$offenders"; exit 1
          fi
          echo "No environment file is committed."

      - name: No key material is committed
        run: |
          offenders=$(git ls-files | grep -E '\.(pem|key|p12|jks)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Cryptographic material is committed:"; echo "$offenders"; exit 1
          fi
          echo "No key material is committed."

      - name: .env.example is present
        run: test -f .env.example || { echo "::error::.env.example is missing."; exit 1; }

      # The operations scripts (backup, restore, bootstrap) run as root on the
      # server: a shell mistake there costs data. The runner ships shellcheck.
      - name: Shellcheck the scripts
        run: shellcheck --severity=warning scripts/*.sh

  backend:
    name: Backend (build and tests)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Includes the Testcontainers integration tests; the GitHub runner
      # already provides Docker (doc 10 §2).
      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint, tests and build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Tests
        working-directory: frontend
        run: npm test --if-present -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

      # Only what reaches the browser blocks the build; development tooling is
      # left to Dependabot, so a lint advisory never stops a deployment.
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Two browser journeys against the full environment (D17): real nginx, CSP,
  # cookies and CSRF, which MockMvc and the fake API do not exercise.
  e2e:
    name: End-to-end (full environment)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the environment with throwaway passwords
        run: |
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$admin_password"
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^LOCAL_ADMIN_PASSWORD=.*/LOCAL_ADMIN_PASSWORD=$admin_password/" .env
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Start the environment
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Publish the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

      - name: Tear down the environment
        if: always()
        run: docker compose down -v

  # The production compose is not run in CI (it needs a domain and TLS), but a
  # syntax error or a missing required variable would only show on the server.
  prod-config:
    name: Production compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.prod.yml
        env:
          APP_DOMAIN: prospect.example.test
          ACME_EMAIL: ops@example.test
          POSTGRES_PASSWORD: validation-only
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate the Caddyfile
        run: >
          docker run --rm -e APP_DOMAIN=prospect.example.test -e ACME_EMAIL=ops@example.test
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Quality gate: fails if any required job failed. Skipped jobs (a project not
  # created yet) do not block.
  gate:
    name: CI result
    needs: [hygiene, backend, frontend, e2e, prod-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "hygiene=${{ needs.hygiene.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "prod-config=${{ needs.prod-config.result }}"
          for r in "${{ needs.hygiene.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}"                    "${{ needs.e2e.result }}" "${{ needs.prod-config.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job did not pass: $r"; exit 1 ;;
            esac
          done
          echo "CI passed."
