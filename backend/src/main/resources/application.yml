# JH.COMP Prospect — configuracao do backend.
#
# Nenhum segredo neste arquivo (RNF-006). Credenciais vem de variavel de
# ambiente; em producao, de secret manager.

spring:
  application:
    name: jhcomp-prospect
    version: @project.version@

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/jhcomp_prospect}
    username: ${POSTGRES_USER:jhcomp}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    # O schema pertence ao Flyway. Hibernate nunca altera estrutura (doc 04 §6).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # RNF-009: timestamps persistidos em UTC.
          time_zone: UTC
        # Falha cedo em consulta que gere N+1 por colecao paginada.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations aplicadas sao imutaveis; divergencia de checksum deve falhar.
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    # O Spring Boot 4 usa Jackson 3 (pacote tools.jackson), que ja serializa
    # data/hora como ISO-8601 por padrao. A antiga propriedade
    # serialization.write-dates-as-timestamps nao existe mais em
    # SerializationFeature e faz o contexto falhar ao subir.

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true

  # Importacao CSV sincrona limitada a 2 MB (D14). O teto do multipart fica um
  # pouco acima para que o caso de uso responda com erro de validacao claro,
  # e nao o container com 413 generico, ate esse ponto.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${BACKEND_PORT:8081}
  servlet:
    context-path: /api/v1
    session:
      timeout: 8h
      cookie:
        name: JHSESSION
        # Decisao D1. O cookie nunca e legivel por JavaScript.
        http-only: true
        # Em producao e obrigatoriamente true; em desenvolvimento local o
        # frontend fala HTTP, e um cookie Secure nao seria enviado.
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        path: /

  error:
    # RNF-003: nunca expor stack trace.
    include-stacktrace: never
    include-message: never
  # Limite de payload; ajustado por endpoint de upload na Etapa 5.
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.jhcomp.prospect: DEBUG
  pattern:
    # Correlation ID entra na Etapa 3, junto do filtro de request.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

# ---------------------------------------------------------------------------
# Bootstrap de desenvolvimento local (perfil "local").
# Nao tem efeito em outros perfis. Sem LOCAL_ADMIN_PASSWORD, nada e criado.
# ---------------------------------------------------------------------------
jhcomp:
  bootstrap:
    admin-email: ${LOCAL_ADMIN_EMAIL:admin@jhcomp.local}
    admin-password: ${LOCAL_ADMIN_PASSWORD:}
    organization-name: ${LOCAL_ORGANIZATION_NAME:JH.COMP}
