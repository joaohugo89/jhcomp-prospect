# Nginx serve o frontend e faz proxy da API.
#
# O proxy existe por uma razao de seguranca, nao de conveniencia: a decisao D1
# pressupoe frontend e backend na MESMA ORIGEM. Com origens diferentes, o
# cookie de sessao SameSite=Lax nao seria enviado nas chamadas da aplicacao e
# seria necessario CORS com credenciais, que e mais frouxo e mais facil de
# configurar errado.

# Protocolo original. Atras do Caddy (producao) o pedido chega aqui em HTTP,
# mas o cliente usou HTTPS: repassar $scheme faria o backend achar que a conexao
# e insegura, e o cookie CSRF sairia sem Secure. Sem proxy na frente (local),
# vale o esquema desta conexao.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nao revela a versao do nginx nas respostas e paginas de erro.
    server_tokens off;

    # Cabecalhos de seguranca: ver security-headers.conf, incluido em cada
    # location porque add_header de location anula o do server.
    include /etc/nginx/snippets/security-headers.conf;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # ---- API ----
    location /api/v1/ {
        proxy_pass http://backend:8081/api/v1/;

        # Importacao CSV aceita ate 2 MB (D14); o padrao do nginx e 1 MB e
        # cortaria o envio antes de chegar ao backend.
        client_max_body_size 3m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Uma analise de site ou chamada de IA pode passar de 60s; o timeout
        # curto do padrao cortaria a resposta no meio.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # O Spring Security ja manda estes dois; sem esconder, sairiam em dobro.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        # Resposta de API nunca e cacheada: traz dado por organizacao.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- Assets com hash no nome: podem ser cacheados agressivamente ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---- SPA: qualquer rota desconhecida devolve o index ----
    location / {
        # index.html nunca e cacheado, senao o navegador continuaria carregando
        # a versao antiga apos um deploy.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
