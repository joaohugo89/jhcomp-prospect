# Cabecalhos de seguranca (doc 05 §12, doc 10 §8).
#
# Incluido em CADA location do nginx.conf, e nao so no server: no nginx, um
# add_header dentro de um location descarta todos os add_header herdados. Com
# os cabecalhos apenas no server, o Cache-Control do location / apagava todos,
# e a pagina ficava sem protecao contra clickjacking.

add_header X-Content-Type-Options "nosniff"     always;
add_header X-Frame-Options        "DENY"        always;
add_header Referrer-Policy        "same-origin" always;

# Ferramenta interna: nao deve ser indexada.
add_header X-Robots-Tag "noindex, nofollow" always;

# So recursos da propria origem. O build do Vite nao tem script nem estilo
# inline; style={{...}} do React vai pelo CSSOM, que o style-src nao bloqueia.
# connect-src 'self' tambem impede que um script injetado envie dados para fora.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
